# TEST-ONLY WORKFLOW.
#
# Mirrors the pipeline shape that choreon-api's `github.hbs` template
# renders into every customer repo, with three deliberate deltas:
#
#   1. Install URL points at the new choreonx CLI (stg-latest), not the
#      legacy Go CLI. Once this pipeline goes green end-to-end here,
#      the same swap lands in choreon-api's template PR.
#   2. Binary is `choreon-stg` (baked BASE_URL = api-stg.choreon.dev).
#      The prd flavor will be `choreon` again once cli-release.yml has
#      cut its first prd release; for validation-before-template-flip
#      the stg binary is the right target.
#   3. Trigger is workflow_dispatch, not push-to-main, so this test
#      repo doesn't fire a deploy on every incidental commit.
#
# Everything else — buildpacks setup, apt install curl, the env vars,
# the deploy call — is a byte-for-byte copy of the template so that
# passing here is a real signal for the template flip.

name: Choreon Deploy (choreonx stg-latest — test)

on:
  # Fires on push to the test branch so we can validate the pipeline
  # end-to-end without needing this workflow on the default branch
  # (workflow_dispatch requires that). Once the choreon-api template
  # PR flips the customer-facing pipeline, this whole file goes away.
  push:
    branches:
      - 'test/choreonx-pipeline'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Service into Choreon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Buildpacks Tools
        id: setup-tools
        uses: buildpacks/github-actions/setup-tools@v5.1.0

      - name: Setup Pack
        id: setup-pack
        uses: buildpacks/github-actions/setup-pack@v5.1.0

      - name: Install Dependencies
        run: |
          sudo apt-get update -y && sudo apt-get install -y curl
          curl -fsSL https://public.choreon.dev/artifacts/choreon-cli/choreonx-staging/install-stg-latest.sh | bash
          # TEMPORARY — remove once PR #21 (choreonx#21) is merged and
          # cli-stg-latest.yml has republished install-stg-latest.sh.
          # PR #21 makes the installer append $HOME/.choreon/bin to
          # $GITHUB_PATH itself; until it lands, we do it here so the
          # next step can find choreon-stg on PATH.
          echo "$HOME/.choreon/bin" >> "$GITHUB_PATH"

      - name: Sanity check — CLI on PATH, version resolves
        # Belt-and-braces: confirms that PR #21's $GITHUB_PATH extension
        # actually made choreon-stg discoverable to this step's fresh
        # shell before we call `deploy`. If this step 127s, the deploy
        # step will too — but with a clearer error message here.
        run: |
          command -v choreon-stg
          choreon-stg --version

      - name: Bootstrap CLI config from CI token
        env:
          CHOREON_TOKEN: ${{ secrets.CHOREON_TOKEN }}
        # Simulates the eventual `choreon pipeline deploy` bootstrap in
        # the current CLI: unwrap the base64(JSON) CI token, extract the
        # accessToken/refreshToken JWTs, and write ~/.choreon/config.json
        # under the `stg` env slot. Once that's on disk, `service deploy`
        # resolves projectId from the JWT's projectIds[0] claim.
        #
        # In the future PR this whole step disappears — `pipeline deploy`
        # does the unwrap in-process, no on-disk config needed for CI.
        # For the drill it's the shortest path to a real deploy with the
        # honest resolution chain (project from token, service from flag
        # which future PR will read from .choreon).
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib

          def decode_jwt_payload(jwt):
              parts = jwt.split('.')
              if len(parts) < 2:
                  return None
              seg = parts[1] + '=' * (-len(parts[1]) % 4)
              return json.loads(base64.urlsafe_b64decode(seg))

          tok = os.environ['CHOREON_TOKEN']
          unwrapped = json.loads(base64.b64decode(tok))
          at, rt = unwrapped['accessToken'], unwrapped['refreshToken']

          # Sanity-log the claims (no PII, no secrets).
          claims = decode_jwt_payload(at)
          print('accessToken claims summary:')
          print(json.dumps({
              'organizationId': claims.get('organizationId'),
              'projectIds': claims.get('projectIds'),
              'type': claims.get('type'),
              'gitProvider': claims.get('gitProvider'),
          }, indent=2))

          # Write ~/.choreon/config.json in the shape config-service reads.
          cfg = { 'envs': { 'stg': { 'token': at, 'refreshToken': rt } } }
          cfg_path = pathlib.Path.home() / '.choreon' / 'config.json'
          cfg_path.parent.mkdir(parents=True, exist_ok=True)
          cfg_path.write_text(json.dumps(cfg))
          cfg_path.chmod(0o600)
          print(f'wrote {cfg_path} (mode 600)')
          PY

      - name: Deploy
        env:
          CHOREON_TOKEN: ${{ secrets.CHOREON_TOKEN }}
          CHOREON_SANDBOX: ${{ secrets.CHOREON_SANDBOX }}
        # Explicit --id sourced from this repo's .choreon file (targets[0].id).
        # The Go CLI resolves this automatically from .choreon; choreonx's
        # `service deploy` doesn't read that file yet — a separate gap to
        # close before flipping the choreon-api customer template, so the
        # bare-argument `choreon service deploy` pattern keeps working.
        run: choreon-stg service deploy --id 30294a5d-d5cd-4305-baaf-834a97c1ab7c
